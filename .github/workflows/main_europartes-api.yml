# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Django to Azure Web App - europartes-api

on:
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Normalize requirements and ensure Gunicorn
        working-directory: Backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import codecs
          import re

          p = Path("requirements.txt")
          raw = p.read_bytes()

          if raw.startswith((codecs.BOM_UTF16_LE, codecs.BOM_UTF16_BE)):
              text = raw.decode("utf-16")
          elif b"\x00" in raw[:200]:
              even_nulls = raw[:200:2].count(0)
              odd_nulls = raw[1:200:2].count(0)
              encoding = "utf-16-le" if odd_nulls > even_nulls else "utf-16-be"
              text = raw.decode(encoding).lstrip("\ufeff")
          else:
              text = raw.decode("utf-8-sig")

          lines = text.splitlines()

          has_gunicorn = any(
              re.match(
                  r"^\s*gunicorn(?:\[[^\]]+\])?(?:\s|[<=>~!;]|$)",
                  line,
                  re.IGNORECASE,
              )
              for line in lines
          )

          if not has_gunicorn:
              lines.append("gunicorn")

          p.write_text(
              "\n".join(lines).rstrip() + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Upload Backend deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            Backend/
            !Backend/.env
            !Backend/**/.env
            !Backend/**/*.env
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45D5C455BEB549DF98FF94F113E3C94C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9A13AAF7132D4BCF8DAECE018D7F999E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B6C2B058FF6946399A571863F1C557D5 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: europartes-api
          slot-name: Production
          package: .

      - name: Configure Django startup command
        run: |
          az webapp config set \
            --resource-group rg-europartes \
            --name europartes-api \
            --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 config.wsgi:application"
