<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Europartes | Sistema de gestión</title>

    <!-- Aplica el tema guardado antes del primer pintado para evitar parpadeos. -->
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('europartes_theme') || 'light';
                var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) { /* almacenamiento no disponible */ }
        })();
    </script>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- Hojas de estilo modulares -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/theme.css">

    <!-- Boxicons para UI -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- Pantalla de carga global (operaciones de red) -->
    <div id="global-loader" class="hidden">
        <div class="spinner"></div>
    </div>

    <!-- Módulo de autenticación aislado -->
    <div id="login-root" class="hidden"></div>

    <!-- Módulo de aplicación protegido -->
    <div id="app-layout" class="hidden">

        <!-- Navegación lateral -->
        <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
            <div class="sidebar-header">
                <div class="brand-mark"><i class='bx bxs-car-mechanic'></i></div>
                <div class="brand-copy">
                    <span class="logo-text">Europartes</span>
                    <small>Sistema de gestión</small>
                </div>
            </div>

            <nav id="sidebar-nav" class="sidebar-nav" aria-label="Módulos del sistema"></nav>

            <div class="sidebar-footer">
                <div class="sidebar-status"><span class="status-dot"></span><span>Conectado al servidor</span></div>
            </div>
        </aside>

        <!-- Contenedor principal de vistas -->
        <div class="main-wrapper">
            <div id="route-progress" aria-hidden="true"></div>
            <header id="topbar">
                <div class="topbar-left">
                    <button id="toggle-sidebar" class="btn-icon" aria-label="Abrir menú de navegación" aria-controls="sidebar" aria-expanded="false" title="Menú">
                        <i class='bx bx-menu'></i>
                    </button>
                    <div class="page-context">
                        <span id="breadcrumb-section">Europartes</span>
                        <strong id="breadcrumb-page">Sistema de gestión</strong>
                    </div>
                </div>
                <div class="topbar-actions">
                    <button id="toggle-currency" class="topbar-chip" type="button" title="Cambiar moneda">
                        <i class='bx bx-money'></i><span>Moneda: NIO</span>
                    </button>
                    <button id="toggle-theme" class="btn-icon" aria-label="Cambiar tema" title="Cambiar tema">
                        <i class='bx bx-moon'></i>
                    </button>
                    <div class="user-menu">
                        <button id="user-menu-toggle" class="user-menu-trigger" type="button" aria-expanded="false" aria-haspopup="menu">
                            <span class="user-avatar" id="user-avatar">EU</span>
                            <span class="user-summary">
                                <strong id="topbar-user-name">Usuario</strong>
                                <small id="topbar-user-role">Rol</small>
                            </span>
                            <i class='bx bx-chevron-down'></i>
                        </button>
                        <div id="user-menu-panel" class="user-menu-panel hidden" role="menu">
                            <div class="user-menu-heading">
                                <strong id="menu-user-name">Usuario</strong>
                                <span id="menu-user-role">Rol</span>
                            </div>
                            <a href="#/configuracion" class="user-menu-action" role="menuitem" data-rbac-action="cuenta.cambiarClave">
                                <i class='bx bx-key'></i><span>Cambiar contraseña</span>
                            </a>
                            <a href="#/configuracion" class="user-menu-action" role="menuitem">
                                <i class='bx bx-cog'></i><span>Configuración</span>
                            </a>
                            <button id="btn-logout" class="user-menu-action is-danger" type="button" role="menuitem">
                                <i class='bx bx-log-out'></i><span>Cerrar sesión</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Zona dinámica gobernada por el Router -->
            <main id="main-content"></main>
        </div>
    </div>

    <!-- Zonas de inyección de componentes globales -->
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite" aria-relevant="additions" aria-atomic="false"></div>

    <!-- Motor de arranque -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
