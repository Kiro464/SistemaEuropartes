<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europartes | Sistema POS SPA</title>
    
    <!-- Hojas de estilo modulares (RUTAS RELATIVAS CORREGIDAS) -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <!-- Boxicons para UI -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <!-- Pantalla de Carga Global (Transiciones de Red pesadas) -->
    <div id="global-loader" class="hidden">
        <div class="spinner"></div>
    </div>

    <!-- Módulo de Autenticación Aislado -->
    <div id="login-root" class="hidden"></div>

    <!-- Módulo de Aplicación Protegido -->
    <div id="app-layout" class="hidden">
        
        <!-- Navegación Lateral -->
        <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
            <div class="sidebar-header">
                <div class="brand-mark"><i class='bx bx-car'></i></div>
                <div class="brand-copy">
                    <span class="logo-text">Sistema de gestión</span>
                    <small>Gestión empresarial</small>
                </div>
            </div>

            <nav id="sidebar-nav" class="sidebar-nav" aria-label="Módulos del sistema"></nav>

            <div class="sidebar-footer">
                <div class="sidebar-status"><span class="status-dot"></span><span>Sistema operativo</span></div>
            </div>
        </aside>

        <!-- Contenedor Principal de Vistas -->
        <div class="main-wrapper">
            <header id="topbar">
                <div class="topbar-left">
                    <button id="toggle-sidebar" class="btn-icon" aria-label="Abrir menú de navegación" aria-controls="sidebar" aria-expanded="false" title="Menú">
                        <i class='bx bx-menu'></i>
                    </button>
                    <div class="page-context">
                        <span id="breadcrumb-section">Europartes</span>
                        <strong id="breadcrumb-page">Sistema de gestión</strong>
                    </div>
                </div>
                <div class="topbar-actions">
                    <button id="toggle-currency" class="topbar-chip" type="button" title="Cambiar moneda">
                        <i class='bx bx-money'></i><span>Moneda: NIO</span>
                    </button>
                    <button id="toggle-theme" class="btn-icon" aria-label="Cambiar tema" title="Cambiar tema">
                        <i class='bx bx-moon'></i>
                    </button>
                    <div class="user-menu">
                        <button id="user-menu-toggle" class="user-menu-trigger" type="button" aria-expanded="false">
                            <span class="user-avatar" id="user-avatar">EU</span>
                            <span class="user-summary">
                                <strong id="topbar-user-name">Usuario</strong>
                                <small id="topbar-user-role">Rol</small>
                            </span>
                            <i class='bx bx-chevron-down'></i>
                        </button>
                        <div id="user-menu-panel" class="user-menu-panel hidden">
                            <div class="user-menu-heading">
                                <strong id="menu-user-name">Usuario</strong>
                                <span id="menu-user-role">Rol</span>
                            </div>
                            <button id="btn-logout" class="user-menu-action" type="button">
                                <i class='bx bx-log-out'></i><span>Cerrar sesión</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Zona dinámica gobernada por el Router -->
            <main id="main-content">
                <!-- Se inyecta código de template literals aquí -->
            </main>
        </div>
    </div>

    <!-- Zonas de Inyección de Componentes de UI Globales -->
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite" aria-relevant="additions" aria-atomic="false"></div>

    <!-- Motor de arranque (RUTA RELATIVA CORREGIDA) -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
